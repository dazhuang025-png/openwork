name: Build Windows Exe (Simple)

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (npm)
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Patch tauri.conf.json (Use npm & Disable Updater)
        shell: powershell
        run: |
          $path = "src-tauri/tauri.conf.json"
          $content = Get-Content $path -Raw
          # Configure to use npm instead of pnpm
          $content = $content -replace 'pnpm dev:web', 'npm run dev:web'
          $content = $content -replace 'pnpm build:web', 'npm run build:web'
          # Disable updater artifacts to skip signing requirement
          $content = $content -replace '"createUpdaterArtifacts": true', '"createUpdaterArtifacts": false'
          Set-Content -Path $path -Value $content
          
          Write-Host "Patched tauri.conf.json content:"
          Get-Content $path

      - name: Build Windows App
        run: npm run build -- --verbose
        env:
          TAURI_SKIP_UPDATER_SIGNATURE: true

      - name: List Build Output (Debug)
        shell: powershell
        run: |
          Write-Host "Listing src-tauri/target/release:"
          Get-ChildItem -Path "src-tauri/target/release" -ErrorAction SilentlyContinue
          Write-Host "Listing src-tauri/target/release/bundle:"
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -ErrorAction SilentlyContinue

      - name: Upload Raw Executable
        uses: actions/upload-artifact@v4
        with:
          name: OpenWork-Raw-Exe
          path: src-tauri/target/release/OpenWork.exe
          if-no-files-found: warn

      - name: Upload Installer (MSI)
        uses: actions/upload-artifact@v4
        with:
          name: OpenWork-Installer-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Installer (EXE)
        uses: actions/upload-artifact@v4
        with:
          name: OpenWork-Installer-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
